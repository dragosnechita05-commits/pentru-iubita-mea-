<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Pentru tine ❤️</title>
<style>
  * { box-sizing: border-box; }
  :root{
    --bg1:#fff4f7;
    --bg2:#ffe7ef;
    --text:#3d2630;
    --accent:#ff5c86;
    --accent2:#c53d61;
    --card:rgba(255,255,255,.55);
  }
  html, body { height: 100%; }
  body{
    margin:0;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background: linear-gradient(135deg,var(--bg1),var(--bg2),#fff9fb);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  .app{
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
  }

  .page{
    width:min(94vw,640px);
    min-height:min(84vh,760px);
    background:var(--card);
    border:1px solid rgba(255,255,255,.5);
    border-radius:28px;
    box-shadow:0 18px 50px rgba(120,50,75,.12);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:28px 18px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .page.active{ display:flex; }

  .heart{
    font-size:58px;
    margin-bottom:14px;
    animation:beat 1.2s infinite;
  }
  .question, .message{
    margin:0;
    line-height:1.45;
    font-weight:700;
  }
  .question{
    font-size:clamp(24px,5.8vw,38px);
    max-width: 18ch;
  }
  .message{
    font-size:clamp(22px,5.5vw,34px);
    max-width: 22ch;
  }
  .small{
    margin-top:12px;
    font-size:14px;
    line-height:1.45;
    color:#6f4a56;
    max-width: 44ch;
  }

  .buttons{
    margin-top:26px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    min-height:84px;
    position:relative;
  }

  .btn{
    border:0;
    border-radius:999px;
    padding:14px 24px;
    font-size:18px;
    font-weight:800;
    box-shadow:0 8px 18px rgba(80,30,50,.15);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition: transform .12s ease, opacity .2s ease;
    user-select:none;
  }
  .btn:active{ transform:scale(.98); }
  .yes{ background:var(--accent); color:#fff; }
  .no{ background:#fff; color:var(--accent2); }

  /* Sunt două zone separate ca să nu se suprapună butoanele */
  .left-zone, .right-zone{
    width:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    min-height:84px;
  }

  .dodge-area{
    position:relative;
    width:min(100%, 250px);
    height:96px;
    border-radius:20px;
  }

  .dodge-btn{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    min-width:104px;
  }

  .continue-wrap{
    margin-top:20px;
    display:none;
    width:100%;
    justify-content:center;
  }

  .continue{
    background:#3d2630;
    color:#fff;
    min-width:180px;
  }

  .fade-in{
    animation:fadeIn .35s ease;
  }

  .floating-heart{
    position:fixed;
    bottom:-30px;
    pointer-events:none;
    animation:floatUp 4s linear forwards;
    z-index:0;
  }

  @keyframes beat{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.14); }
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes floatUp{
    from{ transform:translateY(0); opacity:.85; }
    to{ transform:translateY(-110vh); opacity:0; }
  }

  .page-content{ position:relative; z-index:2; width:100%; }
</style>
</head>
<body>
<div class="app">

  <!-- PAGINA 1 -->
  <section class="page active" id="page1">
    <div class="page-content">
      <div class="heart">❤️</div>
      <p class="question">Hei iubita mea, sunt iubitul tău tocilar și am niște întrebări 😅<br>Ai chef să răspunzi?</p>

      <div class="buttons">
        <div class="left-zone">
          <div class="dodge-area" id="p1-dodge-area">
            <button class="btn yes dodge-btn" id="p1yes" type="button">DA ❤️</button>
          </div>
        </div>
        <div class="right-zone">
          <button class="btn no" id="p1no" type="button">NU 😭</button>
        </div>
      </div>

      <div class="continue-wrap" id="p1continueWrap">
        <button class="btn continue" id="p1continue" type="button">Continuă</button>
      </div>

      <div id="p1message"></div>
    </div>
  </section>

  <!-- PAGINA 2 -->
  <section class="page" id="page2">
    <div class="page-content">
      <p class="question">Crezi că ne-am atașat prea mult unul de celălalt în ultimul timp?</p>

      <div class="buttons">
        <button class="btn yes" id="p2yes" type="button">DA</button>
        <button class="btn no" id="p2no" type="button">NU</button>
      </div>

      <div class="continue-wrap" id="p2continueWrap">
        <button class="btn continue" id="p2continue" type="button">Continuă</button>
      </div>

      <div id="p2message"></div>
    </div>
  </section>

  <!-- PAGINA 3 -->
  <section class="page" id="page3">
    <div class="page-content">
      <p class="question">Mă vezi în viitorul tău?</p>

      <div class="buttons">
        <div class="left-zone">
          <div class="dodge-area" id="p3-dodge-area">
            <button class="btn yes dodge-btn" id="p3yes" type="button">DA ❤️</button>
          </div>
        </div>
        <div class="right-zone">
          <button class="btn no" id="p3no" type="button">NU 😭</button>
        </div>
      </div>

      <div class="continue-wrap" id="p3continueWrap">
        <button class="btn continue" id="p3continue" type="button">Continuă</button>
      </div>

      <div id="p3message"></div>
    </div>
  </section>

  <!-- PAGINA 4 -->
  <section class="page" id="page4">
    <div class="page-content">
      <div class="heart">❤️</div>
      <p class="message">Mulțumesc, pentru că ai apărut în viața mea</p>
    </div>
  </section>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const pages = ["page1", "page2", "page3", "page4"];

  function showPage(id) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    $(id).classList.add("active");
  }

  function revealContinue(wrapId) {
    const wrap = $(wrapId);
    wrap.style.display = "flex";
    wrap.classList.add("fade-in");
  }

  function hideContinue(wrapId) {
    $(wrapId).style.display = "none";
  }

  function setHTML(id, html) {
    $(id).innerHTML = html;
  }

  // Muta un buton doar în zona lui, ca să nu ajungă sub alt buton
  function moveWithinArea(button, area) {
    const areaRect = area.getBoundingClientRect();
    const btnRect = button.getBoundingClientRect();

    const minLeft = 8;
    const minTop = 8;
    const maxLeft = Math.max(8, areaRect.width - btnRect.width - 8);
    const maxTop = Math.max(8, areaRect.height - btnRect.height - 8);

    const left = minLeft + Math.random() * maxLeft;
    const top = minTop + Math.random() * maxTop;

    button.style.left = left + "px";
    button.style.top = top + "px";
    button.style.transform = "none";
  }

  // PAGINA 1: DA fuge de 3 ori, apoi apare butonul de continuare
  let p1Dodges = 0;
  const p1yes = $("p1yes");
  const p1Area = $("p1-dodge-area");

  function p1Dodge(ev) {
    ev.preventDefault();
    ev.stopPropagation();

    if (p1Dodges < 3) {
      p1Dodges++;
      moveWithinArea(p1yes, p1Area);
      return;
    }

    // după a 4-a încercare nu mai fuge, apare continuarea
    p1yes.disabled = true;
    p1yes.style.opacity = ".55";
    revealContinue("p1continueWrap");
  }

  p1yes.addEventListener("pointerdown", p1Dodge);
  p1yes.addEventListener("touchstart", p1Dodge, { passive: false });

  $("p1continue").addEventListener("click", () => showPage("page2"));

  $("p1no").addEventListener("click", () => {
    setHTML("p1message", `
      <div class="message fade-in">Știam eu că nu mă mai iubești, nu mai ai chef de mine 😭😭😭</div>
      <div class="small fade-in">Vezi fraiero că butonul ăla fuge doar de 3 ori, a 4-a oară te lasă să îl apeși, pregătește-te și pt următoarele 😂</div>
    `);
    revealContinue("p1continueWrap");
  });

  // PAGINA 2
  $("p2yes").addEventListener("click", () => {
    setHTML("p2message", `<div class="message fade-in">Scrie-mi despre asta.</div>`);
    revealContinue("p2continueWrap");
  });

  $("p2no").addEventListener("click", () => {
    setHTML("p2message", `<div class="message fade-in">Te iubesc din tot sufletul meu și te-aș vrea lângă mine ca un egoist, tot timpul ❤️❤️❤️</div>`);
    revealContinue("p2continueWrap");
  });

  $("p2continue").addEventListener("click", () => showPage("page3"));

  // PAGINA 3: DA fuge mereu, NU arată mesajul, apoi continuare
  const p3yes = $("p3yes");
  const p3Area = $("p3-dodge-area");

  function p3Dodge(ev) {
    ev.preventDefault();
    ev.stopPropagation();
    moveWithinArea(p3yes, p3Area);
  }

  p3yes.addEventListener("pointerdown", p3Dodge);
  p3yes.addEventListener("touchstart", p3Dodge, { passive: false });

  $("p3no").addEventListener("click", () => {
    setHTML("p3message", `<div class="message fade-in">Ghinion, am stabilit azi noapte pe la 00:00 că nu ne mai scăpăm unul de celălalt 😂</div>`);
    revealContinue("p3continueWrap");
  });

  $("p3continue").addEventListener("click", () => showPage("page4"));

  // Inimioare pe pagina finală
  setInterval(() => {
    if (!$("page4").classList.contains("active")) return;

    const el = document.createElement("div");
    el.className = "floating-heart";
    el.textContent = ["❤️", "💕", "💗", "💖"][Math.floor(Math.random() * 4)];
    el.style.left = Math.random() * 100 + "vw";
    el.style.fontSize = (18 + Math.random() * 18) + "px";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4200);
  }, 650);
</script>
</body>
</html>
